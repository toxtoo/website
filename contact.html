  <meta name="MobileOptimized" content="320">

  <link rel="stylesheet" href="styles/styles.css">
  <link rel="stylesheet" href="styles/contact.css">

</head>

<body>

<div class="wrapper">

    <nav class="site-nav">
        <div class="nav-inner">

            <button class="menu-toggle" type="button">Menu</button>

            <ul class="menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="news.html">News</a></li>
                <li><a href="gallery.html">Gallery</a></li>

                <li><a href="about.html">About</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>

        </div>
    </nav>

		<header>
				<div class="contact-bg">
						<div class="logo">
								<h1><a href="index.html"><img src="img/logo.png"  alt="Stonebow Field Archers - Contact."></a></h1>
						</div>
				</div>
		</header>

		<main>
	    <div class="content">
	                	
	        	 <div class="row">
           <div class="col full">
           	
               <fieldset>
	<legend>&nbsp;Contact Us&nbsp;</legend>
  <form name="contact" method="POST" action="/thankyou.html" netlify-honeypot="bot-field" netlify data-validate >



  	 <div class="row hidden">
      <div class="col-25">
        <label>Don't fill this out if you're human: </label>
      </div>
      <div class="col-75">
        <input name="bot-field">
      </div>
    </div>

    <div class="row">
      <div class="col-25">
        <label for="textminmax">Name:</label>
      </div>
      <div class="col-75">
        <input type="text" minlength="2" name="textminmax" id="textminmax" value="" required>
      </div>
    </div>

    <div class="row">
      <div class="col-25">
        <label for="email">Email:</label>
      </div>
      <div class="col-75">
        <input type="email" id="email" name="email" data-bouncer-message="The domain portion of the email address is invalid (the portion after the @)." required>
      </div>
    </div>


    <div class="row">
      <div class="col-25">
        <label for="message">Message:</label>
      </div>
      <div class="col-75">
        <textarea id="message" name="message" style="height:200px" required></textarea>
      </div>
    </div>

    <div class="row">
    	<br>
      <input type="submit" value="Submit">
    </div>
  </form>
</fieldset>

</div>
</div>
	        	
	        	
	        	
	        <div class="push"></div><!-- For sticky footer -->
	    </div>
    </main>

</div><!-- /wrapper -->
